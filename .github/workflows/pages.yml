name: Deploy to GitHub Pages

# 기본 브랜치에 푸시될 때마다 정적 사이트를 GitHub Pages로 배포한다.
on:
  push:
    branches: ['claude/spell-book-game-prototype-ru4wkx']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 동시에 하나의 배포만 진행
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Pages는 저장소 Settings에서 1회 활성화 필요(소스: GitHub Actions).
      # 활성화 후에는 푸시마다 이 단계가 기존 Pages 설정을 읽어 배포한다.
      - name: Configure Pages
        uses: actions/configure-pages@v5

      # 저장소 루트 전체를 사이트 산출물로 업로드 (index.html이 진입점)
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
